name: update-dashboard

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC, ~07:00 Paris
  workflow_dispatch:

permissions:
  contents: write

# un clic sur « Rafraîchir » peut lancer le workflow pendant le cron : un seul à la fois
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # un run en attente (concurrency) doit partir du dernier main, pas du commit au moment du déclenchement
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch Strava and write encrypted data
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: python tools/fetch_strava.py

      # accès Garmin non officiel : un échec ne doit pas bloquer la mise à jour Strava
      - name: Fetch Garmin and write encrypted data
        continue-on-error: true
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: |
          if [ -z "$GARMIN_TOKEN_KEY" ] || [ ! -f state/garmin_tokens.enc.json ]; then
            echo "Garmin non configuré, étape ignorée."
          else
            python tools/fetch_garmin.py
          fi

      - name: Commit encrypted data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/data.enc.json docs/garmin.enc.json state/garmin_tokens.enc.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Pas de changement."
          else
            git commit -m "chore: update encrypted data"
            # le plan peut avoir été commité depuis la page pendant l'exécution
            # fichiers chiffrés régénérés en entier : en cas de conflit, la version de ce run gagne
            git pull --rebase -X theirs
            git push
          fi
